# Compila e testa o app a cada push, nos servidores do GitHub.
# O resultado aparece na aba "Actions" do repositório.
name: Testes do app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analisar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # versão fixa: a 3.48 passou a exigir Gradle 9, que o projeto ainda não usa
          flutter-version: '3.47.9'
          cache: true
      - run: flutter --version
      - name: Instalar dependências
        run: flutter pub get
      - name: Análise do código (erros de compilação)
        # só falha por erros; avisos e dicas de estilo não derrubam o teste
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes (PIDs, calculados e CSV)
        run: flutter test

  gerar-apk:
    needs: analisar-e-testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # versão fixa: a 3.48 passou a exigir Gradle 9, que o projeto ainda não usa
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Gerar APK de teste
        run: flutter build apk --debug
      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: fuel-sentinel-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # APK de uso (release): menor e mais rápido que o de teste. É assinado com a
  # chave de depuração (como está no build.gradle), o que basta para instalar
  # direto no celular. A cada push na branch test ele também é publicado na
  # página Releases do repositório (release "teste"), com um link fixo.
  apk-release:
    needs: analisar-e-testar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # versão fixa: a 3.48 passou a exigir Gradle 9, que o projeto ainda não usa
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      # Assina com a chave fixa guardada nos Secrets (KEYSTORE_BASE64 e
      # KEYSTORE_PASSWORD), para o APK novo atualizar o instalado. O número do
      # build sobe a cada execução, porque o Android só aceita atualizar para
      # um número maior.
      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/fuel-sentinel-v2.jks
            {
              echo "storeFile=fuel-sentinel-v2.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=fuelsentinel"
            } > android/key.properties
            echo "Assinando com a chave fixa."
          else
            echo "::warning::Secrets da chave não cadastrados: o APK sai com a chave de depuração e não atualiza o instalado."
          fi
      - name: Gerar APK release
        run: flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 10))
      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: fuel-sentinel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar em Releases (só na branch test)
        if: github.ref == 'refs/heads/test' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk fuel-sentinel.apk
          NOTAS="APK gerado automaticamente a cada push na branch test. Último commit: ${GITHUB_SHA::7} em $(date -u '+%d/%m/%Y %H:%M') UTC."
          if gh release view teste >/dev/null 2>&1; then
            gh release edit teste --notes "$NOTAS"
          else
            gh release create teste --prerelease --target test --title "Fuel Sentinel (branch test)" --notes "$NOTAS"
          fi
          gh release upload teste fuel-sentinel.apk --clobber
